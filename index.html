<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課題忘れない</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; background: #f5f5f5; }
  h1 { font-size: 22px; }
  form { display: flex; flex-direction: column; gap: 8px; background: white; padding: 12px; border-radius: 8px; }
  input, button { padding: 10px; font-size: 16px; }
  button { background: #2563eb; color: white; border: none; border-radius: 6px; }
  ul { list-style: none; padding: 0; }
  li { background: white; margin: 8px 0; padding: 12px; border-radius: 8px; border-left: 6px solid #22c55e; display: flex; justify-content: space-between; align-items: center; }
  li.soon { border-left-color: #f59e0b; }
  li.urgent { border-left-color: #ef4444; }
  li.over { border-left-color: #6b7280; opacity: 0.6; }
  .info small { color: #666; }
  .del { background: #e5e7eb; color: #333; }
</style>
</head>
<body>
<h1>課題忘れない</h1>
<form id="form">
  <input id="subject" placeholder="科目" required>
  <input id="title" placeholder="課題の内容" required>
  <input id="due" type="date" required>
  <button type="submit">追加</button>
</form>
<ul id="list"></ul>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

function daysLeft(due) {
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(due) - today) / 86400000);
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  tasks.sort((a, b) => a.due.localeCompare(b.due));
  tasks.forEach((t, i) => {
    const d = daysLeft(t.due);
    const li = document.createElement("li");
    li.className = d < 0 ? "over" : d <= 1 ? "urgent" : d <= 3 ? "soon" : "";
    const label = d < 0 ? "期限切れ" : d === 0 ? "今日まで！" : "あと" + d + "日";
    li.innerHTML = `<div class="info"><strong>${t.subject}</strong>　${t.title}<br><small>${t.due}（${label}）</small></div>`;
    const btn = document.createElement("button");
    btn.textContent = "完了";
    btn.className = "del";
    btn.onclick = () => { tasks.splice(i, 1); save(); render(); };
    li.appendChild(btn);
    list.appendChild(li);
  });
}

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  tasks.push({
    subject: document.getElementById("subject").value,
    title: document.getElementById("title").value,
    due: document.getElementById("due").value
  });
  save(); render(); e.target.reset();
};

render();
</script>
</body>
</html>
